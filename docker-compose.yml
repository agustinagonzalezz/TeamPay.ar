services:
  postgres:
    image: postgres:16-alpine
    container_name: teampay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: gestion_equipo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d gestion_equipo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
